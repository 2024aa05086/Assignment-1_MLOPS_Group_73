name: CI

on:
  push:
    branches: ["test-1"]
  pull_request:
    branches: ["test-1"]

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          # Ensure pytest can import your package
          PYTHONPATH: .
        run: |
          pytest -q

      - name: Train model
        env:
          # FIX: Add current directory to python path so it finds 'heart_disease_mlops'
          PYTHONPATH: .
        run: |
          python -m heart_disease_mlops.src.train --data-path heart_disease_mlops/data/heart.csv --output-dir heart_disease_mlops/models

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            heart_disease_mlops/models
            heart_disease_mlops/models/metrics.json