name: CI

on:
  push:
    branches: ["test-1"]
  pull_request:
    branches: ["test-1"]

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer editable install when packaging files exist (best practice for -m package execution)
          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            pip install -e .
          fi
          # Install runtime/test deps if requirements files exist
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Run unit tests
        run: |
          pytest -q

      - name: Train model
        env:
          # Make repo root importable so `python -m heart_disease_mlops.src.train` can find the package
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m heart_disease_mlops.src.train \
            --data-path heart_disease_mlops/data/heart.csv \
            --output-dir heart_disease_mlops/models

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            heart_disease_mlops/models
            heart_disease_mlops/models/metrics.json
